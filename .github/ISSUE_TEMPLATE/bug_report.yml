name: Reporte de defecto
description: Informa un problema reproducible en el cálculo, la interfaz o la PWA.
title: "[Defecto]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        No incluyas credenciales ni datos sensibles. Para vulnerabilidades, usa el reporte privado indicado en SECURITY.md.
  - type: dropdown
    id: area
    attributes:
      label: Área
      options:
        - Cálculo
        - Interfaz/accesibilidad
        - PWA/offline
        - AWS/despliegue
        - Documentación
    validations:
      required: true
  - type: textarea
    id: descripcion
    attributes:
      label: Descripción
      description: Explica qué ocurrió y qué esperabas.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      placeholder: |
        1. Selecciona...
        2. Ingresa...
        3. Pulsa...
    validations:
      required: true
  - type: textarea
    id: entradas
    attributes:
      label: Entradas y cálculo manual
      description: Obligatorio si el problema altera el resultado. Incluye unidades.
  - type: input
    id: navegador
    attributes:
      label: Navegador y versión
  - type: textarea
    id: evidencia
    attributes:
      label: Evidencia adicional
      description: Capturas, mensajes de consola o referencias normativas.
