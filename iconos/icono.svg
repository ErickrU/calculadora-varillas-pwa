<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Calculadora de Varillas</title>
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2936"/>
      <stop offset="1" stop-color="#0b1118"/>
    </linearGradient>
  </defs>
  <!-- Fondo con esquinas redondeadas -->
  <rect width="512" height="512" rx="112" fill="url(#fondo)"/>
  <!-- Sección de concreto -->
  <rect x="96" y="96" width="320" height="320" rx="18" fill="#cfd6dd" stroke="#8f9aa6" stroke-width="6"/>
  <!-- Estribo -->
  <rect x="140" y="140" width="232" height="232" rx="22" fill="none" stroke="#f2a93b" stroke-width="16"/>
  <!-- Varillas longitudinales (8 barras) -->
  <g fill="#1b242d" stroke="#f2a93b" stroke-width="6">
    <circle cx="140" cy="140" r="24"/>
    <circle cx="256" cy="140" r="24"/>
    <circle cx="372" cy="140" r="24"/>
    <circle cx="140" cy="256" r="24"/>
    <circle cx="372" cy="256" r="24"/>
    <circle cx="140" cy="372" r="24"/>
    <circle cx="256" cy="372" r="24"/>
    <circle cx="372" cy="372" r="24"/>
  </g>
</svg>
