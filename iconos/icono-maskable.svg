<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Calculadora de Varillas (maskable)</title>
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2936"/>
      <stop offset="1" stop-color="#0b1118"/>
    </linearGradient>
  </defs>
  <!-- Fondo a sangre completa: el sistema aplica su propia máscara -->
  <rect width="512" height="512" fill="url(#fondo)"/>
  <!-- Contenido dentro de la zona segura (círculo central del 80 %) -->
  <rect x="136" y="136" width="240" height="240" rx="14" fill="#cfd6dd" stroke="#8f9aa6" stroke-width="5"/>
  <rect x="169" y="169" width="174" height="174" rx="17" fill="none" stroke="#f2a93b" stroke-width="12"/>
  <g fill="#1b242d" stroke="#f2a93b" stroke-width="5">
    <circle cx="169" cy="169" r="18"/>
    <circle cx="256" cy="169" r="18"/>
    <circle cx="343" cy="169" r="18"/>
    <circle cx="169" cy="256" r="18"/>
    <circle cx="343" cy="256" r="18"/>
    <circle cx="169" cy="343" r="18"/>
    <circle cx="256" cy="343" r="18"/>
    <circle cx="343" cy="343" r="18"/>
  </g>
</svg>
